version: 2

project_name: k8switch

env:
  - CGO_ENABLED=0

builds:
  - id: k8switch
    main: ./cmd/k8switch
    binary: k8switch
    goos:
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - builds:
      - k8switch
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
